apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fs-boiler

resources:
  - manifests/configmap.yaml
  - manifests/imagestream.yaml
  - manifests/service.yaml
  - manifests/route.yaml
  - manifests/volumeclaim.yaml
  - manifests/deployment.yaml

configurations:
  - manifests/kustomizeconfig.yaml

images:
  - name: source-image
    newName: ghcr.io/mluukkai/fs-boilerplate
    newTag: latest

patches:
  - target:
      kind: Route
      name: route
    patch: |-
      - op: add
        path: /spec/host
        value: route-fs-boiler.ext.okd-cs-test-0.k8s.cs.helsinki.fi
